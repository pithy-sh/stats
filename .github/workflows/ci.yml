name: CI

# The card's three gates and `pithy doctor`, on every pull request and every push to main, so a required Gates check always
# reports.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-24.04
    # A hang backstop, well above a normal run.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: "package.json"

      # The kit is an ordinary dependency here: `@pithy-sh/*` resolve from npm by the lockfile.
      - name: Install
        run: bun install --frozen-lockfile

      # Biome first: it is the fastest gate and the most common failure.
      - name: Biome
        run: bunx biome check .

      - name: Typecheck
        run: bun run typecheck

      # Doctor reads the local dev database's migration ledger, so setup migrates it first. No Cloudflare credentials
      # are set here: setup stays local, and doctor skips every staging and prod check that needs the account.
      - name: Local backend
        run: bun run pithy setup --skip-install

      # `--offline` makes no network call, so a new kit release on npm cannot turn this red. It still fails on a
      # wrangler.jsonc stanza that drops a declared var or holds one its schema refuses.
      - name: Doctor
        run: bun run pithy doctor --offline

      # Both projects: node, and workers, which runs the collector Workflow in workerd against a real D1.
      - name: Test
        run: bun run test
